<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Sridharsini's creative B.Sc. Computer Science student portfolio">

<title>Sridharsini | Creative CS Student</title>

<style>
:root {
    --v: #7652d6;
    --v2: #a78bfa;
    --lav: #f2ecff;
    --ink: #29243b;
    --muted: #716b82;
    --line: #e8e0f6;
    --shadow: 0 14px 40px #59369b18;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 85px;
}

body {
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    line-height: 1.7;
    background: linear-gradient(
        180deg,
        #ffffff,
        #fcfaff 55%,
        #f7f2ff
    );
}

a {
    color: inherit;
    text-decoration: none;
}

.wrap {
    width: min(1100px, calc(100% - 32px));
    margin: auto;
}

/* NAVIGATION */

header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #ffffffeb;
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
}

.nav {
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.brand {
    font-size: 1.25rem;
    font-weight: 900;
    color: var(--v);
}

.brand span {
    color: #e9a1d2;
}

nav ul {
    display: flex;
    gap: 20px;
    list-style: none;
}

nav a {
    font-size: 0.9rem;
    font-weight: 700;
    color: #625a76;
}

nav a:hover {
    color: var(--v);
}

.menu {
    display: none;
    border: 1px solid var(--line);
    background: white;
    color: var(--v);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 1.1rem;
    cursor: pointer;
}

/* HERO SECTION */

.hero {
    padding: 65px 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 92% 15%,
            #eee5ff 0,
            transparent 28%
        ),
        radial-gradient(
            circle at 3% 95%,
            #ffe8f5 0,
            transparent 25%
        );
}

.hero-grid {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 50px;
    align-items: center;
}

.tag {
    display: inline-block;
    padding: 6px 13px;
    background: var(--lav);
    color: var(--v);
    border-radius: 99px;
    font-size: 0.84rem;
    font-weight: 800;
    margin-bottom: 18px;
}

h1 {
    font-size: clamp(2.8rem, 7vw, 5rem);
    line-height: 1.08;
    letter-spacing: -1.7px;
    margin-bottom: 16px;
}

.grad {
    background: linear-gradient(
        100deg,
        #7450d4,
        #bd73d6,
        #e28dbb
    );
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
}

.hero h2 {
    font-size: clamp(1.1rem, 2.5vw, 1.5rem);
    color: #665d7d;
    margin-bottom: 14px;
}

.hero p,
.intro,
.card p {
    color: var(--muted);
}

.hero p {
    max-width: 600px;
}

.actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 25px;
}
